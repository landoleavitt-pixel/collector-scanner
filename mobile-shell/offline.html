<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0907; color: #f7f1e1; }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .label { font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #c9954a; margin-bottom: 14px; }
  h1 { font-style: italic; font-weight: normal; font-size: 26px; margin: 0 0 12px; }
  p { color: #a99e85; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
  button { background: #c9954a; color: #1a1612; border: 0; border-radius: 999px; padding: 13px 26px; font-family: ui-monospace, monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; }
</style>
</head>
<body>
  <div>
    <div class="label">Fields &amp; Floors</div>
    <h1>You're offline.</h1>
    <p>Check your connection and try again.</p>
    <button onclick="location.href='https://fieldsandfloors.com'">Try again</button>
  </div>
</body>
</html>
