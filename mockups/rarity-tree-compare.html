&lt;html lang=&quot;en&quot;&gt;

&lt;title&gt;Rarity Tree Direction&lt;/title&gt;
&lt;style&gt;
@import url(&#x27;https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap&#x27;);
:root{
  --ink-100:#f7f1e1;--ink-200:#e8dfc9;--ink-400:#a99e85;--ink-600:#6b6354;
  --bg-base:#0a0907;--bg-elev:#14110c;--bg-elev-2:#1a160f;
  --line:#2a251c;--line-soft:#1f1c16;
  --gold:#c9954a;--gold-bright:#e6b96b;--gold-deep:#8f6a32;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-base);color:var(--ink-100);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.page{max-width:1180px;margin:0 auto;padding:40px 16px 80px}
.eyebrow{font:500 11px &#x27;Geist Mono&#x27;,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1{font:italic 400 44px/1 &#x27;Instrument Serif&#x27;,serif;margin:10px 0 8px}
.lede{color:var(--ink-400);font-size:15px;max-width:660px;line-height:1.6;margin:0 0 40px}
.section{margin-bottom:64px}
.section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;border-top:1px solid var(--line);padding-top:18px}
.section-head .tag{font:600 12px &#x27;Geist Mono&#x27;,monospace;color:var(--gold-bright)}
.section-head h2{font:400 26px &#x27;Instrument Serif&#x27;,serif;margin:0}
.section-head p{margin:0 0 0 auto;color:var(--ink-400);font-size:13px}

/* Modal shell */
.modal{background:var(--bg-elev);border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:320px 1fr;gap:32px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.6);align-items:start}
.card-img{aspect-ratio:2.5/3.5;border-radius:10px;background:linear-gradient(135deg,#ff9842,#cc5e0d);padding:10px;position:relative}
.card-img::after{content:&#x27;&#x27;;position:absolute;inset:10px;border-radius:6px;background:radial-gradient(ellipse at 50% 35%,#3a2a1c,#120d08 75%)}
.card-img span{position:absolute;bottom:22px;left:0;right:0;text-align:center;z-index:1;font:500 11px &#x27;Geist Mono&#x27;,monospace;letter-spacing:.18em;color:rgba(247,241,225,.5)}
.title{font:400 26px/1.15 &#x27;Instrument Serif&#x27;,serif;margin:0 0 8px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font:700 11px &#x27;Geist Mono&#x27;,monospace;padding:3px 8px;border-radius:4px;color:#1a1612;letter-spacing:.04em;white-space:nowrap}
.chip.outline{color:var(--gold-bright);background:rgba(201,149,74,.06);border:.5px solid var(--gold-deep);font-weight:500}
.t-grail{background:linear-gradient(180deg,#ffd97a,#d99c14);border:.5px solid #ffc14d}
.t-ultra{background:linear-gradient(180deg,#e0e8f0,#98a5b3);border:.5px solid #c8d4e0}
.t-rare{background:linear-gradient(180deg,#d6884a,#8e4f1f);border:.5px solid #d6722d}
.t-scarce{background:linear-gradient(180deg,#8a96a4,#4a5360);border:.5px solid #5a6470;font-weight:600}
.price{font:500 28px Geist,sans-serif;margin:4px 0 16px}
.price small{font-size:13px;color:var(--ink-400);font-weight:400;margin-left:8px}
.actions{display:flex;gap:8px;margin-bottom:22px}
.btn{font:600 11px Geist,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:12px 16px;border-radius:6px;border:.5px solid rgba(232,226,213,.18);color:var(--ink-100);background:transparent}
.btn.primary{flex:1;background:linear-gradient(180deg,#ffd97a,#d99c14);color:#1a1612;border:0}

/* ── Rarity block ── */
.rarity{border:1px solid var(--line);border-radius:12px;background:var(--bg-base);overflow:hidden}
.r-hero{padding:16px 18px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:end}
.r-hero .label{grid-column:1/-1;font:500 11px &#x27;Geist Mono&#x27;,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-400)}
.r-hero .big{font:italic 400 30px/1.05 &#x27;Instrument Serif&#x27;,serif}
.r-hero .big b{font-weight:400;color:var(--gold-bright)}
.r-hero .sub{font-size:13px;color:var(--ink-200);grid-column:1;line-height:1.45}
.r-hero .rank{grid-row:2/4;grid-column:2;text-align:right}
.r-hero .rank .n{font:400 40px/1 &#x27;Instrument Serif&#x27;,serif;color:var(--gold-bright)}
.r-hero .rank .of{font:500 11px &#x27;Geist Mono&#x27;,monospace;color:var(--ink-400);letter-spacing:.08em}

/* Strip: one segment per rung, rarest on the right */
.strip{padding:2px 18px 16px}
.strip-bar{display:flex;gap:2px;height:14px}
.strip-bar i{flex:1;border-radius:2px;opacity:.5;box-shadow:inset 0 0 0 .5px rgba(232,226,213,.18)}
.strip-bar i.on{opacity:1;outline:2px solid var(--gold-bright);outline-offset:2px;flex:1.6}
.strip-ends{display:flex;justify-content:space-between;margin-top:8px;font:500 11px &#x27;Geist Mono&#x27;,monospace;color:var(--ink-600);letter-spacing:.06em}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--line);background:var(--bg-elev-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink-400);font:500 11px &#x27;Geist Mono&#x27;,monospace;letter-spacing:.08em;padding:6px 10px}
.seg button.on{background:rgba(201,149,74,.14);color:var(--gold-bright)}
.toolbar .count{font:500 11px &#x27;Geist Mono&#x27;,monospace;color:var(--ink-600);letter-spacing:.06em}

/* Rung ladder */
.ladder{padding:6px 12px 14px;border-top:1px solid var(--line)}
.tier-head{display:flex;align-items:center;gap:8px;margin:12px 6px 4px}
.tier-head .chip{font-size:10px;padding:2px 6px}
.tier-head span:last-child{font:500 11px &#x27;Geist Mono&#x27;,monospace;color:var(--ink-600)}
.tier-head::after{content:&#x27;&#x27;;flex:1;height:1px;background:var(--line-soft)}
.rung{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;padding:7px 6px;border-radius:8px}
.rung .run{font:500 13px/22px &#x27;Geist Mono&#x27;,monospace;color:var(--ink-400);text-align:right}
.pchips{display:flex;flex-wrap:wrap;gap:5px}
.p{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:20px;color:var(--ink-200);padding:1px 8px 1px 3px;border-radius:5px;background:var(--bg-elev);border:1px solid var(--line-soft);white-space:nowrap}
.p .sw{width:14px;height:14px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 .5px rgba(232,226,213,.25)}
.p small{font:500 10px &#x27;Geist Mono&#x27;,monospace;color:var(--ink-600);letter-spacing:.04em}
.p.dim{opacity:.28}
.rung.on{background:rgba(201,149,74,.09);box-shadow:inset 0 0 0 1px rgba(230,185,107,.4)}
.rung.on .run{color:var(--gold-bright)}
.p.me{background:rgba(201,149,74,.16);border-color:var(--gold-bright);color:var(--ink-100);font-weight:500}
.here{font:600 10px &#x27;Geist Mono&#x27;,monospace;letter-spacing:.14em;text-transform:uppercase;color:#1a1612;background:var(--gold-bright);padding:1px 5px;border-radius:3px;margin-left:2px}
.fold{display:flex;align-items:center;gap:10px;width:calc(100% - 12px);margin:4px 6px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--ink-400);font:500 12px Geist,sans-serif;text-align:left}
.fold .mini{display:flex;gap:2px;flex:none}
.fold .mini i{width:8px;height:10px;border-radius:2px;opacity:.7}
.fold b{color:var(--gold-bright);font-weight:500;margin-left:auto;font:500 11px &#x27;Geist Mono&#x27;,monospace;letter-spacing:.1em}
.unnum{margin:10px 6px 0;padding-top:12px;border-top:1px solid var(--line)}
.unnum .h{font:500 11px &#x27;Geist Mono&#x27;,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-400);margin-bottom:8px}
.source{margin:12px 6px 0;font-size:12px;color:var(--ink-600)}

.notice{margin:0 18px 14px;padding:12px 14px;border-radius:8px;border:1px dashed rgba(201,149,74,.35);font-size:13px;line-height:1.55;color:var(--ink-200)}
.notice a{color:var(--gold-bright);text-decoration:none;border-bottom:1px solid var(--gold-deep)}
.urow{display:grid;grid-template-columns:1fr 64px;gap:4px 10px;align-items:center;padding:6px 8px;border-radius:8px}
.urow .bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
.urow .rg{grid-row:1/3;grid-column:2;text-align:right;font:500 13px &#x27;Geist Mono&#x27;,monospace;color:var(--ink-400)}
.urow.on{background:rgba(201,149,74,.09);box-shadow:inset 0 0 0 1px rgba(230,185,107,.4)}
.urow.on .rg{color:var(--gold-bright)}

/* Phone */
.phones{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.phone{width:390px;max-width:100%;border:10px solid #1b1813;border-radius:48px;background:var(--bg-base);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.phone .notch{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font:600 14px Geist,sans-serif}
.phone .sheet{background:var(--bg-elev);border-radius:20px 20px 0 0;padding:10px 12px 24px;border-top:1px solid var(--line)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.phone .card-img{width:140px;margin:0 auto 14px}
.phone .title{font-size:22px}
.phone .r-hero{padding:14px 14px 10px}
.phone .r-hero .big{font-size:26px}
.phone .strip,.phone .toolbar{padding-left:14px;padding-right:14px}
.phone .ladder{padding:4px 6px 12px}
.phone .rung{grid-template-columns:44px 1fr;gap:8px}
.phone .actions .btn:not(.primary){padding:12px}
.caption{text-align:center;color:var(--ink-400);font-size:13px;margin-top:12px;max-width:390px}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.note{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--bg-elev)}
.note h3{margin:0 0 6px;font:500 11px &#x27;Geist Mono&#x27;,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.note p{margin:0;font-size:14px;line-height:1.55;color:var(--ink-200)}

@media (max-width:860px){
  .modal{grid-template-columns:1fr;padding:18px}
  .modal .card-img{width:200px;margin:0 auto}
  .section-head{flex-wrap:wrap}
  .section-head p{margin:0;width:100%}
}

  &lt;section class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;tag&quot;&gt;B&lt;/span&gt;&lt;h2&gt;Known set · iPhone app&lt;/h2&gt;&lt;p&gt;Same component in the card sheet&lt;/p&gt;&lt;/div&gt;

            &lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;btn primary&quot;&gt;View on eBay ↗&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;☆&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;↗&lt;/button&gt;&lt;/div&gt;

  &lt;section class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;tag&quot;&gt;C&lt;/span&gt;&lt;h2&gt;Partial matches&lt;/h2&gt;&lt;p&gt;Serial only · unmapped rainbow · no serial&lt;/p&gt;&lt;/div&gt;

        &lt;div class=&quot;phone&quot;&gt;&lt;div class=&quot;notch&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span&gt;●●●&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;sheet&quot;&gt;&lt;div class=&quot;grab&quot;&gt;&lt;/div&gt;&lt;div class=&quot;rarity&quot; data-tree=&quot;known&quot; data-open=&quot;1&quot; data-serial=&quot;250&quot;&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;/div&gt;

      &lt;/div&gt;

        &lt;div class=&quot;phone&quot;&gt;&lt;div class=&quot;notch&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span&gt;●●●&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;sheet&quot;&gt;&lt;div class=&quot;grab&quot;&gt;&lt;/div&gt;&lt;div class=&quot;rarity&quot; data-tree=&quot;nodata&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;section class=&quot;section&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Notes&lt;/span&gt;&lt;h2&gt;Decisions to confirm&lt;/h2&gt;&lt;/div&gt;
    &lt;div class=&quot;notes&quot;&gt;
      &lt;div class=&quot;note&quot;&gt;&lt;h3&gt;Rungs, not rows&lt;/h3&gt;&lt;p&gt;One row per print run, with parallels as wrapping chips. Real data: 28 numbered parallels on 14 rungs, and the four /99s share one line. Chips drop the repeated “Refractor”.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;note&quot;&gt;&lt;h3&gt;Fold around the match&lt;/h3&gt;&lt;p&gt;It opens with 2 rungs above and below this card. The folds show a mini colour preview and a count (“5 more common rungs”). One tap opens a fold.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;note&quot;&gt;&lt;h3&gt;Visible by default&lt;/h3&gt;&lt;p&gt;The hero and strip are always on. The ladder is behind one tap so View on eBay stays above the fold on a phone.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;note&quot;&gt;&lt;h3&gt;Box filter (optional)&lt;/h3&gt;&lt;p&gt;Hobby counts Hobby, Jumbo and Breaker boxes. Retail counts Blaster, Monster and Mega. Parallels without odds for that box are dimmed. Optional for v1.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;note&quot;&gt;&lt;h3&gt;Odds as quiet text&lt;/h3&gt;&lt;p&gt;Unnumbered parallels form a chip cloud at the base, with odds in small mono (“1:3 hobby”). Numbered chips skip odds to stay compact.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;note&quot;&gt;&lt;h3&gt;Type &amp;amp; tokens&lt;/h3&gt;&lt;p&gt;An 11px floor, Geist 13 for chips and Geist Mono 13 for runs. Dark tokens and the locked tier chips only. Every swatch gets a light hairline so Black stays visible.&lt;/p&gt;&lt;/div&gt;

&lt;script&gt;
// Real data: lib/parallelData.js → 2024-topps-chrome-baseball (getRungs order, rarest first)

&quot;k&quot;:&quot;aqua&quot;,&quot;g&quot;:[&quot;#3fc6c9&quot;,&quot;#1a8a90&quot;],&quot;o&quot;:{&quot;Hobby&quot;:&quot;1:179&quot;,&quot;Jumbo&quot;:&quot;1:55&quot;,&quot;Breaker&quot;:&quot;1:5&quot;,&quot;Blaster&quot;:&quot;1:503&quot;,&quot;Monster&quot;:&quot;1:205&quot;}},{&quot;n&quot;:&quot;Aqua Lava Refractor&quot;,&quot;k&quot;:&quot;aqua-lava&quot;,&quot;g&quot;:[&quot;#3fc6c9&quot;,&quot;#1a8a90&quot;],&quot;o&quot;:{&quot;Hobby&quot;:&quot;1:179&quot;,&quot;Jumbo&quot;:&quot;1:55&quot;,&quot;Breaker&quot;:&quot;1:5&quot;,&quot;Blaster&quot;:&quot;1:503&quot;,&quot;Monster&quot;:&quot;1:205&quot;}},{&quot;n&quot;:&quot;Aqua Raywave Refractor&quot;,&quot;k&quot;:&quot;aqua-raywave&quot;,&quot;g&quot;:[&quot;#3fc6c9&quot;,&quot;#1a8a90&quot;],&quot;o&quot;:{&quot;Blaster&quot;:&quot;1:151&quot;,&quot;Monster&quot;:&quot;1:101&quot;}}]],[250,[{&quot;n&quot;:&quot;Purple Refractor&quot;,&quot;k&quot;:&quot;purple&quot;,&quot;g&quot;:[&quot;#8a4dd9&quot;,&quot;#5d2da3&quot;],&quot;o&quot;:{&quot;Hobby&quot;:&quot;1:143&quot;,&quot;Jumbo&quot;:&quot;1:44&quot;,&quot;Breaker&quot;:&quot;1:4&quot;,&quot;Blaster&quot;:&quot;1:403&quot;,&quot;Monster&quot;:&quot;1:164&quot;}}]],[275,[{&quot;n&quot;:&quot;Purple Sonar Refractor&quot;,&quot;k&quot;:&quot;purple-sonar&quot;,&quot;g&quot;:[&quot;#8a4dd9&quot;,&quot;#5d2da3&quot;],&quot;o&quot;:{&quot;Blaster&quot;:&quot;1:109&quot;,&quot;Monster&quot;:&quot;1:73&quot;}}]],[299,[{&quot;n&quot;:&quot;Purple Speckle Refractor&quot;,&quot;k&quot;:&quot;purple-speckle&quot;,&quot;g&quot;:[&quot;#8a4dd9&quot;,&quot;#5d2da3&quot;],&quot;o&quot;:{&quot;Hobby&quot;:&quot;1:119&quot;,&quot;Jumbo&quot;:&quot;1:36&quot;,&quot;Breaker&quot;:&quot;1:3&quot;,&quot;Blaster&quot;:&quot;1:334&quot;,&quot;Monster&quot;:&quot;1:136&quot;}}]],[350,[{&quot;n&quot;:&quot;Magenta Speckle Refractor&quot;,&quot;k&quot;:&quot;magenta-speckle&quot;,&quot;g&quot;:[&quot;#d94db0&quot;,&quot;#93226e&quot;],&quot;o&quot;:{&quot;Hobby&quot;:&quot;1:102&quot;,&quot;Jumbo&quot;:&quot;1:31&quot;,&quot;Breaker&quot;:&quot;1:3&quot;,&quot;Blaster&quot;:&quot;1:285&quot;,&quot;Monster&quot;:&quot;1:116&quot;}}]]],&quot;unnum&quot;:[{&quot;n&quot;:&quot;Refractor&quot;,&quot;k&quot;:&quot;refractor&quot;,&quot;g&quot;:[&quot;#d8d8d8&quot;,&quot;#9a9a9a&quot;],&quot;o&quot;:{&quot;Hobby&quot;:&quot;1:3&quot;,&quot;Jumbo&quot;:&quot;1:1&quot;,&quot;Breaker&quot;:&quot;1:1&quot;,&quot;Blaster&quot;:&quot;1:4&quot;,&quot;Monster&quot;:&quot;1:3&quot;}},{&quot;n&quot;:&quot;Big Apple Refractor&quot;,&quot;k&quot;:&quot;big-apple&quot;,&quot;g&quot;:[&quot;#d8d8d8&quot;,&quot;#9a9a9a&quot;],&quot;o&quot;:{},&quot;x&quot;:&quot;Fanatics Fest NYC&quot;},{&quot;n&quot;:&quot;X-Fractor&quot;,&quot;k&quot;:&quot;x-fractor&quot;,&quot;g&quot;:[&quot;#c4d6c4&quot;,&quot;#7da37d&quot;],&quot;o&quot;:{&quot;Monster&quot;:&quot;1:1&quot;}},{&quot;n&quot;:&quot;Sepia Refractor&quot;,&quot;k&quot;:&quot;sepia&quot;,&quot;g&quot;:[&quot;#b8a37a&quot;,&quot;#8a7045&quot;],&quot;o&quot;:{&quot;Blaster&quot;:&quot;1:4&quot;}},{&quot;n&quot;:&quot;Pink Refractor&quot;,&quot;k&quot;:&quot;pink&quot;,&quot;g&quot;:[&quot;#ffb3d1&quot;,&quot;#cc6f95&quot;],&quot;o&quot;:{&quot;Blaster&quot;:&quot;1:4&quot;}},{&quot;n&quot;:&quot;Prism Refractor&quot;,&quot;k&quot;:&quot;prism&quot;,&quot;g&quot;:[&quot;#d8d8d8&quot;,&quot;#9a9a9a&quot;],&quot;o&quot;:{&quot;Hobby&quot;:&quot;1:6&quot;,&quot;Jumbo&quot;:&quot;1:2&quot;,&quot;Blaster&quot;:&quot;1:7&quot;,&quot;Monster&quot;:&quot;1:7&quot;}},{&quot;n&quot;:&quot;Raywave Refractor&quot;,&quot;k&quot;:&quot;raywave&quot;,&quot;g&quot;:[&quot;#d8d8d8&quot;,&quot;#9a9a9a&quot;],&quot;o&quot;:{&quot;Blaster&quot;:&quot;1:9&quot;,&quot;Monster&quot;:&quot;1:4&quot;}},{&quot;n&quot;:&quot;Negative Refractor&quot;,&quot;k&quot;:&quot;negative&quot;,&quot;g&quot;:[&quot;#e8e8e8&quot;,&quot;#2a2a2a&quot;],&quot;o&quot;:{&quot;Hobby&quot;:&quot;1:89&quot;,&quot;Jumbo&quot;:&quot;1:27&quot;,&quot;Breaker&quot;:&quot;1:3&quot;,&quot;Blaster&quot;:&quot;1:249&quot;,&quot;Monster&quot;:&quot;1:101&quot;}}]};
D.source = &#x27;Checklist Insider&#x27;;
const RUNGS = D.rungs, UNNUM = D.unnum;
const BOXES = {hobby:[&#x27;Hobby&#x27;,&#x27;Jumbo&#x27;,&#x27;Breaker&#x27;], retail:[&#x27;Blaster&#x27;,&#x27;Monster&#x27;,&#x27;Mega&#x27;]};
const TIERS = [[&#x27;1 of 1&#x27;,&#x27;t-grail&#x27;,&#x27;1&#x27;,1,1],[&#x27;Grail&#x27;,&#x27;t-grail&#x27;,&#x27;2–25&#x27;,2,25],[&#x27;Ultra&#x27;,&#x27;t-ultra&#x27;,&#x27;26–99&#x27;,26,99],[&#x27;Rare&#x27;,&#x27;t-rare&#x27;,&#x27;100–249&#x27;,100,249],[&#x27;Scarce&#x27;,&#x27;t-scarce&#x27;,&#x27;250+&#x27;,250,1e9]];
const g = c=&gt;`linear-gradient(135deg,${c[0]},${c[1]})`;
const short = n =&gt; n===&#x27;Refractor&#x27; ? n : n.replace(/ Refractor$/,&#x27;&#x27;);
const tierOf = run =&gt; TIERS.find(t=&gt;run&gt;=t[3]&amp;&amp;run&lt;=t[4]);
const inBox = (p,box) =&gt; box===&#x27;all&#x27; || BOXES[box].some(b=&gt;p.o[b]);
const oddsTxt = p =&gt; { const k=[&#x27;Hobby&#x27;,&#x27;Blaster&#x27;,&#x27;Monster&#x27;,&#x27;Jumbo&#x27;,&#x27;Breaker&#x27;].find(b=&gt;p.o[b]); return k ? `${p.o[k]} ${k.toLowerCase()}` : (p.x||&#x27;&#x27;); };
const total = RUNGS.reduce((a,r)=&gt;a+r[1].length,0);

function chip(p, me, box){
  return `&lt;span class=&quot;p${me?&#x27; me&#x27;:&#x27;&#x27;}${inBox(p,box)?&#x27;&#x27;:&#x27; dim&#x27;}&quot;&gt;&lt;span class=&quot;sw&quot; style=&quot;background:${g(p.g)}&quot;&gt;&lt;/span&gt;${short(p.n)}${me?&#x27;&lt;span class=&quot;here&quot;&gt;This card&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/span&gt;`;
}
function rung(r, st){
  const on = r[0]===st.run;
  return `&lt;div class=&quot;rung${on?&#x27; on&#x27;:&#x27;&#x27;}&quot;&gt;&lt;div class=&quot;run&quot;&gt;/${r[0]}&lt;/div&gt;&lt;div class=&quot;pchips&quot;&gt;${r[1].map(p=&gt;chip(p,on&amp;&amp;p.k===st.key,st.box)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
}
function fold(list, dir, key){
  const n=list.length, range = n&gt;1?`/${list[0][0]}–/${list[n-1][0]}`:`/${list[0][0]}`;
  return `&lt;button class=&quot;fold&quot; data-fold=&quot;${key}&quot;&gt;&lt;span class=&quot;mini&quot;&gt;${list.map(r=&gt;`&lt;i style=&quot;background:${g(r[1][0].g)}&quot;&gt;&lt;/i&gt;`).join(&#x27;&#x27;)}&lt;/span&gt;${n} ${dir} rung${n&gt;1?&#x27;s&#x27;:&#x27;&#x27;} · ${range}&lt;b&gt;SHOW ▾&lt;/b&gt;&lt;/button&gt;`;
}

function known(el, st){
  const mi = RUNGS.findIndex(r=&gt;r[0]===st.run), m = RUNGS[mi];
  const p = st.key &amp;&amp; m[1].find(x=&gt;x.k===st.key);
  const odds = p ? oddsTxt(p) : &#x27;&#x27;;
  const big = p ? `&lt;b&gt;${short(p.n)}&lt;/b&gt; /${st.run}` : `&lt;b&gt;/${st.run}&lt;/b&gt; · ${short(m[1][0].n)} rung`;
  const sub = p
    ? `${odds?odds[0].toUpperCase()+odds.slice(1)+&#x27; · &#x27;:&#x27;&#x27;}${m[1].length} parallel${m[1].length&gt;1?&#x27;s&#x27;:&#x27;&#x27;} at /${st.run} · ${mi} rarer rung${mi===1?&#x27;&#x27;:&#x27;s&#x27;} above`
    : `This card is /${st.run}. The title doesn&#x27;t name the parallel, so we&#x27;re showing its rung.`;
  let h = `&lt;div class=&quot;r-hero&quot;&gt;&lt;div class=&quot;label&quot;&gt;Rarity · ${D.label}&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;${big}&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;${sub}&lt;/div&gt;
    &lt;div class=&quot;rank&quot;&gt;&lt;div class=&quot;n&quot;&gt;#${mi+1}&lt;/div&gt;&lt;div class=&quot;of&quot;&gt;OF ${RUNGS.length} RUNGS&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
  h += `&lt;div class=&quot;strip&quot;&gt;&lt;div class=&quot;strip-bar&quot;&gt;${[...RUNGS].reverse().map(r=&gt;`&lt;i class=&quot;${r[0]===st.run?&#x27;on&#x27;:&#x27;&#x27;}&quot; style=&quot;background:${g(r[1][0].g)}&quot;&gt;&lt;/i&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
    &lt;div class=&quot;strip-ends&quot;&gt;&lt;span&gt;/${RUNGS[RUNGS.length-1][0]} · MOST COPIES&lt;/span&gt;&lt;span&gt;RAREST · /1&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
  h += `&lt;div class=&quot;toolbar&quot;&gt;${st.open?`&lt;div class=&quot;seg&quot;&gt;${[&#x27;all&#x27;,&#x27;hobby&#x27;,&#x27;retail&#x27;].map(b=&gt;`&lt;button data-box=&quot;${b}&quot; class=&quot;${st.box===b?&#x27;on&#x27;:&#x27;&#x27;}&quot;&gt;${b[0].toUpperCase()+b.slice(1)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`:`&lt;span class=&quot;count&quot;&gt;${total} NUMBERED · ${UNNUM.length} UNNUMBERED&lt;/span&gt;`}
    &lt;button class=&quot;seg&quot; data-toggle style=&quot;padding:6px 10px;color:var(--gold-bright);font:500 11px &#x27;Geist Mono&#x27;,monospace;letter-spacing:.14em;background:transparent&quot;&gt;${st.open?&#x27;HIDE ▴&#x27;:&#x27;FULL RAINBOW ▾&#x27;}&lt;/button&gt;&lt;/div&gt;`;
  if(st.open){
    const lo = st.top?0:Math.max(0,mi-2), hi = st.bottom?RUNGS.length-1:Math.min(RUNGS.length-1,mi+2);
    let last=null, body=&#x27;&#x27;;
    if(lo&gt;0) body += fold(RUNGS.slice(0,lo),&#x27;rarer&#x27;,&#x27;top&#x27;);
    for(let i=lo;i&lt;=hi;i++){
      const t=tierOf(RUNGS[i][0]);
      if(t!==last){ body += `&lt;div class=&quot;tier-head&quot;&gt;&lt;span class=&quot;chip ${t[1]}&quot;&gt;${t[0]}&lt;/span&gt;&lt;span&gt;${t[2]}&lt;/span&gt;&lt;/div&gt;`; last=t; }
      body += rung(RUNGS[i], st);
    }
    if(hi&lt;RUNGS.length-1) body += fold(RUNGS.slice(hi+1),&#x27;more common&#x27;,&#x27;bottom&#x27;);
    body += `&lt;div class=&quot;unnum&quot;&gt;&lt;div class=&quot;h&quot;&gt;Unnumbered · by pack odds&lt;/div&gt;&lt;div class=&quot;pchips&quot;&gt;${UNNUM.map(u=&gt;{const o=oddsTxt(u);return `&lt;span class=&quot;p${inBox(u,st.box)?&#x27;&#x27;:&#x27; dim&#x27;}&quot;&gt;&lt;span class=&quot;sw&quot; style=&quot;background:${g(u.g)}&quot;&gt;&lt;/span&gt;${short(u.n)}${o?` &lt;small&gt;${o}&lt;/small&gt;`:&#x27;&#x27;}&lt;/span&gt;`}).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;source&quot;&gt;Source: ${D.source}&lt;/div&gt;`;
    h += `&lt;div class=&quot;ladder&quot;&gt;${body}&lt;/div&gt;`;
  }
  el.innerHTML = h;
}

function unknown(el){
  const run = 50;
  el.innerHTML = `&lt;div class=&quot;r-hero&quot;&gt;&lt;div class=&quot;label&quot;&gt;Rarity · by print run&lt;/div&gt;
    &lt;div class=&quot;big&quot;&gt;&lt;b&gt;/${run}&lt;/b&gt; · Ultra rare&lt;/div&gt;
    &lt;div class=&quot;sub&quot;&gt;Rarer than most numbered cards in the hobby&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;notice&quot;&gt;We haven&#x27;t mapped this card&#x27;s rainbow yet (autos and inserts have their own), so this uses hobby-wide tiers. &lt;a href=&quot;#&quot;&gt;Know it? Send us the list →&lt;/a&gt;&lt;/div&gt;
    &lt;div class=&quot;ladder&quot; style=&quot;border-top:0;padding-top:0&quot;&gt;` + TIERS.map(t=&gt;{
      const on = t[0]===&#x27;Ultra&#x27;, w = Math.max(4, Math.log(Math.min(t[4],499)+1)/Math.log(500)*100);

  const line1 = r.run===1 ? &#x27;One of one&#x27; : `Only ${r.run} made`;
  return `&lt;p class=&quot;rt-line&quot;&gt;${line1}&lt;/p&gt;
    &lt;p class=&quot;rt-sub&quot;&gt;${ix===0?&#x27;The rarest card in&#x27;:ord(ix+1)+&#x27; rarest of &#x27;+n+&#x27; in&#x27;} ${D.label}&lt;/p&gt;
    ${p ? `&lt;p class=&quot;rt-odds&quot;&gt;${packs(p)}&lt;/p&gt;` : `&lt;p class=&quot;fallback&quot;&gt;The listing says ${r.run} made but doesn&#x27;t name the colour.&lt;/p&gt;`}
    &lt;div class=&quot;key&quot;&gt;&lt;i&gt;${keyText.startsWith(&#x27;Higher&#x27;)?&#x27;↑&#x27;:&#x27;←&#x27;}&lt;/i&gt;${keyText}&lt;/div&gt;`;
}

function detail(m, id){
  if(!id) return `&lt;div class=&quot;hint&quot;&gt;Tap any branch to see the colours made at that number&lt;/div&gt;`;
  if(id===&#x27;__roots&#x27;) return `&lt;h4&gt;Not numbered · ${UNNUM.length} colours&lt;/h4&gt;` + UNNUM.map(p=&gt;row(p,false)).join(&#x27;&#x27;);
  const r = m.rungs.find(x=&gt;x.id===id);
  if(m.unknown) return `&lt;h4&gt;${r.name}&lt;/h4&gt;&lt;div class=&quot;hint&quot; style=&quot;text-align:left&quot;&gt;We don&#x27;t have this card&#x27;s colour list yet.&lt;/div&gt;`;
  return `&lt;h4&gt;${made(r.run)} · ${r.members.length} colour${r.members.length&gt;1?&#x27;s&#x27;:&#x27;&#x27;}&lt;/h4&gt;` + r.members.map(p=&gt;row(p, p.k===m.matchKey)).join(&#x27;&#x27;);
}
function row(p, me){
  const h = packsFor(p,[&#x27;Hobby&#x27;,&#x27;Jumbo&#x27;,&#x27;Breaker&#x27;],&#x27;hobby packs&#x27;), rt = packsFor(p,[&#x27;Blaster&#x27;,&#x27;Monster&#x27;,&#x27;Mega&#x27;],&#x27;retail packs&#x27;);
  return `&lt;div class=&quot;drow${me?&#x27; me&#x27;:&#x27;&#x27;}&quot; style=&quot;grid-template-columns:16px 1fr auto&quot;&gt;&lt;span class=&quot;sw&quot; style=&quot;background:${css(p.g)}&quot;&gt;&lt;/span&gt;&lt;span&gt;${short(p.n)}${me?&#x27;&lt;span class=&quot;here&quot;&gt;This card&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;span class=&quot;o&quot;&gt;${p.x ? &#x27;Event only&#x27; : (h || rt)}&lt;/span&gt;&lt;/div&gt;`;
}

function grad(g){ const id=&#x27;g&#x27;+(uid++); return [id, `&lt;defs&gt;&lt;linearGradient id=&quot;${id}&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;1&quot; y2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;${g[0]}&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;${g[1]}&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;`]; }
function thumb(x, y, w, h){
  const id=&#x27;t&#x27;+(uid++);
  return `&lt;defs&gt;&lt;linearGradient id=&quot;${id}&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;1&quot; y2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;#ff9842&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;#cc5e0d&quot;/&gt;&lt;/linearGradient&gt;
    &lt;radialGradient id=&quot;${id}i&quot; cx=&quot;.5&quot; cy=&quot;.3&quot; r=&quot;.75&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;#4a3524&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;#120d08&quot;/&gt;&lt;/radialGradient&gt;&lt;/defs&gt;
    &lt;rect x=&quot;${x-2.5}&quot; y=&quot;${y-2.5}&quot; width=&quot;${w+5}&quot; height=&quot;${h+5}&quot; rx=&quot;6&quot; style=&quot;fill:var(--gold-bright)&quot;/&gt;
    &lt;rect x=&quot;${x}&quot; y=&quot;${y}&quot; width=&quot;${w}&quot; height=&quot;${h}&quot; rx=&quot;4&quot; fill=&quot;url(#${id})&quot;/&gt;
    &lt;rect x=&quot;${x+3}&quot; y=&quot;${y+3}&quot; width=&quot;${w-6}&quot; height=&quot;${h-6}&quot; rx=&quot;2&quot; fill=&quot;url(#${id}i)&quot;/&gt;`;
}
const T = (x,y,txt,o={}) =&gt; `&lt;text x=&quot;${x}&quot; y=&quot;${y}&quot; text-anchor=&quot;${o.a||&#x27;start&#x27;}&quot; style=&quot;fill:${o.c||&#x27;var(--ink-400)&#x27;};font:${o.f||&quot;500 11px &#x27;Geist Mono&#x27;,monospace&quot;};letter-spacing:${o.ls||&#x27;0&#x27;}&quot;&gt;${txt}&lt;/text&gt;`;
function tag(x, y, anchor){ const w=66, x0 = anchor===&#x27;end&#x27;? x-w : anchor===&#x27;middle&#x27;? x-w/2 : x;
  return `&lt;rect x=&quot;${x0}&quot; y=&quot;${y}&quot; width=&quot;${w}&quot; height=&quot;17&quot; rx=&quot;3&quot; style=&quot;fill:var(--gold-bright)&quot;/&gt;${T(x0+w/2, y+12, &#x27;THIS CARD&#x27;, {a:&#x27;middle&#x27;, c:&#x27;var(--ink-on-gold)&#x27;, f:&quot;600 10px &#x27;Geist Mono&#x27;,monospace&quot;, ls:&#x27;.1em&#x27;})}`; }

// ── Direction 1 ──
function tree1(m, W, open, hover){
  const N = m.rungs.length, phone = W &lt; 420;
  const rowH = m.unknown ? 64 : (phone ? 32 : 30), top = 40, cx = W/2, BL = phone ? 46 : 64;
  const ys = i =&gt; top + i*rowH;
  const trunkBot = ys(N-1) + 34, H = trunkBot + (m.unknown ? 40 : 62);
  let s = `&lt;svg class=&quot;tree&quot; viewBox=&quot;0 0 ${W} ${H}&quot; width=&quot;${W}&quot; height=&quot;${H}&quot;&gt;`;
  s += T(cx, 12, &#x27;RAREST&#x27;, {a:&#x27;middle&#x27;, c:&#x27;var(--ink-400)&#x27;, ls:&#x27;.16em&#x27;});
  s += `&lt;path d=&quot;M${cx-1.5} ${top-6} L${cx+1.5} ${top-6} L${cx+5} ${trunkBot} L${cx-5} ${trunkBot} Z&quot; style=&quot;fill:var(--line)&quot;/&gt;`;
  if(!m.unknown){
    const n = UNNUM.length, span = phone ? 120 : 160;
    s += `&lt;g class=&quot;br&quot; data-id=&quot;__roots&quot;&gt;&lt;rect x=&quot;${cx-span/2-10}&quot; y=&quot;${trunkBot-4}&quot; width=&quot;${span+20}&quot; height=&quot;36&quot; fill=&quot;transparent&quot;/&gt;`;
    UNNUM.forEach((u,i)=&gt;{ const tx = cx - span/2 + (span/(n-1))*i, ty = trunkBot + 18 + (i%2)*6;
      s += `&lt;path d=&quot;M${cx} ${trunkBot-6} C ${cx} ${trunkBot+10}, ${tx} ${trunkBot+6}, ${tx} ${ty-4}&quot; style=&quot;stroke:var(--line);fill:none&quot; stroke-width=&quot;1.4&quot;/&gt;`;
      s += `&lt;circle cx=&quot;${tx}&quot; cy=&quot;${ty}&quot; r=&quot;3.5&quot; style=&quot;fill:var(--ink-600)&quot;/&gt;`; });
    s += `&lt;/g&gt;`;
    s += T(cx, H-6, open===&#x27;__roots&#x27; ? &#x27;NOT NUMBERED · MOST COMMON&#x27; : &#x27;MOST COMMON&#x27;, {a:&#x27;middle&#x27;, c: open===&#x27;__roots&#x27;?&#x27;var(--gold-bright)&#x27;:&#x27;var(--ink-400)&#x27;, ls:&#x27;.16em&#x27;});
  } else {
    s += `&lt;path d=&quot;M${cx-34} ${trunkBot+12} Q ${cx} ${trunkBot-8} ${cx+34} ${trunkBot+12}&quot; style=&quot;stroke:var(--line);fill:none&quot; stroke-width=&quot;2&quot;/&gt;`;
    s += T(cx, H-6, &#x27;MOST COMMON&#x27;, {a:&#x27;middle&#x27;, ls:&#x27;.16em&#x27;});
  }
  m.rungs.forEach((r,i)=&gt;{
    const y = ys(i), isM = r.id===m.matchId, sel = r.id===open, hov = r.id===hover;
    const side = i%2 ? -1 : 1, tx = cx + side*BL, ty = y;
    const strokeC = isM ? &#x27;var(--gold-bright)&#x27; : sel ? &#x27;var(--gold)&#x27; : &#x27;var(--line)&#x27;;
    const [gid, gdef] = grad(r.g);
    s += `&lt;g class=&quot;br&quot; data-id=&quot;${r.id}&quot;&gt;${gdef}&lt;rect x=&quot;${side&lt;0?0:cx}&quot; y=&quot;${y-rowH/2}&quot; width=&quot;${cx}&quot; height=&quot;${rowH}&quot; fill=&quot;transparent&quot;/&gt;`;
    s += `&lt;path d=&quot;M${cx} ${y+7} C ${cx+side*BL*.4} ${y+5}, ${tx-side*BL*.4} ${ty}, ${tx} ${ty}&quot; style=&quot;stroke:${strokeC};fill:none&quot; stroke-width=&quot;${isM?2.6:1.5}&quot; stroke-linecap=&quot;round&quot;/&gt;`;
    // sibling leaves: tiny dots along the branch, no text
    for(let k=0;k&lt;Math.min(r.extra,3);k++){ const lx = cx + side*(BL*(.42+k*.14)), ly = y + 4 - (k%2?6:-4);
      s += `&lt;circle cx=&quot;${lx}&quot; cy=&quot;${ly}&quot; r=&quot;2.2&quot; fill=&quot;url(#${gid})&quot; opacity=&quot;.85&quot;/&gt;`; }
    const anchor = side&lt;0 ? &#x27;end&#x27; : &#x27;start&#x27;;
    if(isM){
      const tw = phone ? 30 : 34, th = phone ? 42 : 48, bx = side&lt;0 ? tx - tw : tx, by = ty - th/2;
      s += thumb(bx, by, tw, th);
      const lx = side&lt;0 ? bx - 10 : bx + tw + 10;
      const l1 = m.unknown ? r.name : (m.matchKey ? MATCH.name : &#x27;Colour unknown&#x27;);
      s += T(lx, ty-12, l1, {a:anchor, c:&#x27;var(--ink-100)&#x27;, f:&quot;500 14px Geist,sans-serif&quot;});
      if(!m.unknown) s += T(lx, ty+4, made(r.run), {a:anchor, c:&#x27;var(--ink-200)&#x27;, f:&quot;400 13px Geist,sans-serif&quot;});
      s += tag(lx, m.unknown ? ty-2 : ty+10, anchor);
    } else {
      s += `&lt;circle cx=&quot;${tx}&quot; cy=&quot;${ty}&quot; r=&quot;${i===0?7.5:6}&quot; fill=&quot;url(#${gid})&quot; style=&quot;stroke:${sel||hov?&#x27;var(--gold-bright)&#x27;:&#x27;rgba(232,226,213,.22)&#x27;}&quot; stroke-width=&quot;${sel||hov?2:.75}&quot;/&gt;`;
      if(sel || hov) s += T(tx + side*12, ty+4, m.unknown ? r.name : `${r.name} · ${made(r.run)}`, {a:anchor, c:&#x27;var(--gold-bright)&#x27;, f:&quot;500 13px Geist,sans-serif&quot;});
    }
    s += `&lt;/g&gt;`;
  });
  return s + `&lt;/svg&gt;`;
}

// ── Direction 2 ──
function tree2(m, W, open){
  const phone = W &lt; 420, cx = W/2;
  const mi = m.rungs.findIndex(r=&gt;r.id===m.matchId), mr = m.rungs[mi];
  const mt = m.unknown ? TIERS[2] : tierOf(mr.run);
  const y0 = 22, y1 = 92, y2 = m.unknown ? null : 172, yc = m.unknown ? 168 : 252, H = yc + 104;
  let s = `&lt;svg class=&quot;tree&quot; viewBox=&quot;0 0 ${W} ${H}&quot; width=&quot;${W}&quot; height=&quot;${H}&quot;&gt;`;
  const line = (x1,y1_,x2,y2_,gold) =&gt; `&lt;path d=&quot;M${x1} ${y1_} V${(y1_+y2_)/2} H${x2} V${y2_}&quot; style=&quot;stroke:${gold?&#x27;var(--gold-bright)&#x27;:&#x27;var(--line)&#x27;};fill:none&quot; stroke-width=&quot;${gold?2.6:1.4}&quot; stroke-linejoin=&quot;round&quot;/&gt;`;
  // level 0: set
  s += `&lt;rect x=&quot;${cx-88}&quot; y=&quot;${y0-16}&quot; width=&quot;176&quot; height=&quot;30&quot; rx=&quot;8&quot; style=&quot;fill:var(--bg-elev);stroke:var(--line)&quot;/&gt;`;
  s += T(cx, y0+4, m.unknown ? &#x27;Across the hobby&#x27; : D.label, {a:&#x27;middle&#x27;, c:&#x27;var(--ink-100)&#x27;, f:&quot;italic 400 17px &#x27;Instrument Serif&#x27;,serif&quot;});
  // level 1: five tiers (rarer left), only the gold one labelled
  const span = phone ? W-56 : W-120, xs = i =&gt; cx - span/2 + (span/4)*i;
  TIERS.forEach((t,i)=&gt;{
    const on = t===mt, x = xs(i);
    s += line(cx, y0+14, x, y1-10, on);
    const [gid,gdef] = grad(t.g);
    s += `&lt;g class=&quot;br&quot; data-id=&quot;tier-${t.k}&quot;&gt;${gdef}&lt;circle cx=&quot;${x}&quot; cy=&quot;${y1}&quot; r=&quot;${on?9:6}&quot; fill=&quot;url(#${gid})&quot; style=&quot;stroke:${on?&#x27;var(--gold-bright)&#x27;:&#x27;rgba(232,226,213,.22)&#x27;}&quot; stroke-width=&quot;${on?2:.75}&quot;/&gt;&lt;/g&gt;`;
    if(on) s += T(x, y1+26, t.words, {a: i===0?&#x27;start&#x27;:i===4?&#x27;end&#x27;:&#x27;middle&#x27;, c:&#x27;var(--ink-100)&#x27;, f:&quot;500 13px Geist,sans-serif&quot;});
    if(open===&#x27;tier-&#x27;+t.k &amp;&amp; !on) s += T(x, y1+26, t.words, {a: i===0?&#x27;start&#x27;:i===4?&#x27;end&#x27;:&#x27;middle&#x27;, c:&#x27;var(--gold-bright)&#x27;, f:&quot;500 12px Geist,sans-serif&quot;});
  });
  const tx = xs(TIERS.indexOf(mt));
  // level 2: colours at that tier (rarer left), only the matched one labelled
  let cardX = tx;
  if(!m.unknown){
    const kids = m.rungs.filter(r=&gt;tierOf(r.run)===mt), ks = phone ? 56 : 84, total = (kids.length-1)*ks;
    const x0 = Math.min(Math.max(tx - total/2, 30), W - 30 - total);
    kids.forEach((r,i)=&gt;{
      const x = x0 + i*ks, on = r.id===m.matchId, sel = r.id===open;
      s += line(tx, y1+34, x, y2-10, on);
      const [gid,gdef] = grad(r.g);
      s += `&lt;g class=&quot;br&quot; data-id=&quot;${r.id}&quot;&gt;${gdef}&lt;rect x=&quot;${x-26}&quot; y=&quot;${y2-20}&quot; width=&quot;52&quot; height=&quot;56&quot; fill=&quot;transparent&quot;/&gt;&lt;circle cx=&quot;${x}&quot; cy=&quot;${y2}&quot; r=&quot;${on?9:6}&quot; fill=&quot;url(#${gid})&quot; style=&quot;stroke:${on||sel?&#x27;var(--gold-bright)&#x27;:&#x27;rgba(232,226,213,.22)&#x27;}&quot; stroke-width=&quot;${on||sel?2:.75}&quot;/&gt;`;
      for(let k=0;k&lt;Math.min(r.extra,3);k++) s += `&lt;circle cx=&quot;${x+12+k*6}&quot; cy=&quot;${y2-8}&quot; r=&quot;2&quot; fill=&quot;url(#${gid})&quot; opacity=&quot;.8&quot;/&gt;`;
      if(on) s += T(x, y2+26, m.matchKey ? `${MATCH.name} · ${made(r.run)}` : made(r.run), {a:&#x27;middle&#x27;, c:&#x27;var(--ink-100)&#x27;, f:&quot;500 13px Geist,sans-serif&quot;});
      else if(sel) s += T(x, y2+26, `${r.name} · ${made(r.run)}`, {a:&#x27;middle&#x27;, c:&#x27;var(--gold-bright)&#x27;, f:&quot;500 12px Geist,sans-serif&quot;});
      s += `&lt;/g&gt;`;
      if(on) cardX = x;
    });
  }
  // level 3: the card
  const tw = 52, th = 72, py = m.unknown ? y1+34 : y2+34;
  s += `&lt;path d=&quot;M${cardX} ${py} V${yc-4}&quot; style=&quot;stroke:var(--gold-bright)&quot; stroke-width=&quot;2.6&quot;/&gt;`;
  s += thumb(cardX - tw/2, yc, tw, th);
  s += tag(cardX, yc + th + 10, &#x27;middle&#x27;);
  return s + `&lt;/svg&gt;`;
}

document.querySelectorAll(&#x27;.rt&#x27;).forEach(el=&gt;{
  const d = el.dataset.d, c = el.dataset.case, W = +el.dataset.w;
  let open = el.dataset.open || null, hover = null;
  const draw = () =&gt; {
    const m = model(c);
    const key = d===&#x27;1&#x27; ? &#x27;Higher on the tree = rarer&#x27; : &#x27;Further left = rarer&#x27;;
    const body = d===&#x27;1&#x27; ? tree1(m, W, open, hover) : tree2(m, W, open);
    let det = &#x27;&#x27;;
    if(open &amp;&amp; !open.startsWith(&#x27;tier-&#x27;)) det = detail(m, open);
    else if(!open) det = `&lt;div class=&quot;hint&quot;&gt;${c===&#x27;unknown&#x27;?&#x27;Tap a branch to see how many were made&#x27;:d===&#x27;1&#x27;?&#x27;Tap any branch to see the colours made at that number&#x27;:&#x27;Tap any dot to name it&#x27;}&lt;/div&gt;`;
    el.innerHTML = header(m, c, key) + body + `&lt;div class=&quot;detail&quot;&gt;${det}&lt;/div&gt;`;
  };
  draw();
  el.addEventListener(&#x27;click&#x27;, e=&gt;{ const b = e.target.closest(&#x27;[data-id]&#x27;); if(!b) return; open = open===b.dataset.id ? null : b.dataset.id; draw(); });
  if(d===&#x27;1&#x27; &amp;&amp; W&gt;420){
    el.addEventListener(&#x27;mouseover&#x27;, e=&gt;{ const b = e.target.closest(&#x27;.br&#x27;); const id = b ? b.dataset.id : null; if(id!==hover){ hover=id; draw(); } });
    el.addEventListener(&#x27;mouseleave&#x27;, ()=&gt;{ hover=null; draw(); });
  }
});
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
